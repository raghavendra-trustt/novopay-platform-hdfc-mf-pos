plugins {
    id 'java'
    //id 'org.springframework.boot' version '2.7.8'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.in.novopay.mf.hdfc'
version = '2.0.3-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    //sourceCompatibility = JavaVersion.VERSION_11
}
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    //mavenCentral()
    jcenter()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'net.java.dev.jna:jna:5.13.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation fileTree(dir: 'libs', include: ['*.*'])
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
    implementation group: 'io.reactivex.rxjava2', name: 'rxjava', version: '2.0.1'
    implementation group: 'com.squareup.retrofit2', name: 'retrofit', version: '2.11.0'
    implementation group: 'javax.inject', name: 'javax.inject', version: '1'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.1'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.1'
    // https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.78'
    implementation group: 'io.github.binaryfoo', name: 'emv-bertlv', version: '0.1.8'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.slf4j:jul-to-slf4j'
    implementation 'org.slf4j:jcl-over-slf4j'
    implementation 'org.slf4j:log4j-over-slf4j'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    //implementation 'org.hid4java:hid4java:0.7.0'
    //implementation 'net.java.dev.jna:jna:5.13.0'


}

tasks.named('test') {
    useJUnitPlatform()
}
